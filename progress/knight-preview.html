const PAL_ORDER = ['O','G','F','H','E','L','A','B','D','N','J','C','S','M','K'];
const NAMES = { Warrior:'劍士', Thief:'弓手', Black_Mage:'法師', Ninja:'刺客', Knight:'騎士', White_Mage:'牧師' };
const ORDER = ['Warrior','Thief','Black_Mage','Ninja','Knight','White_Mage'];
const stage = document.getElementById('stage');

function buildCanvas(cls) {
  const d = DATA[cls];
  const pal = d.pal;
  const cell = document.createElement('div');
  cell.className = 'cell';
  const h2 = document.createElement('h2');
  h2.textContent = NAMES[cls] + '（' + cls + '）';
  cell.appendChild(h2);
  const canvases = [];
  for (const [label, frames] of [['IDLE', [0,1]], ['WALK', [3,4]], ['ATTACK', [2,5]], ['HURT', [6,0]]]) {
    const div = document.createElement('div');
    const lab = document.createElement('div');
    lab.className = 'legend';
    lab.textContent = label;
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    div.appendChild(cv);
    div.appendChild(lab);
    cell.appendChild(div);
    canvases.push({ cv, frames });
  }
  stage.appendChild(cell);
  return canvases;
}

function draw(cv, fi, d) {
  const g = cv.getContext('2d');
  g.clearRect(0, 0, 128, 128);
  const rows = d.rows[fi];
  const pal = d.pal;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const ch = rows[y][x];
    if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch];
    g.fillRect(x * 8, y * 8, 8, 8);
  }
}

const anims = {};
for (const cls of ORDER) {
  anims[cls] = buildCanvas(cls);
}
let t = 0;
function loop() {
  t += 1;
  for (const cls of ORDER) {
    const d = DATA[cls];
    const [idle, walk, atk, hurt] = anims[cls];
    draw(idle.cv, Math.floor(t / 14) % 2, d);
    draw(walk.cv, 3 + (Math.floor(t / 10) % 2), d);
    draw(atk.cv, Math.floor(t / 5) % 2 ? 5 : 2, d);
    draw(hurt.cv, t % 24 < 10 ? 6 : 0, d);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
