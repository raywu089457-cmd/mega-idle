<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGA IDLE 品質迴圈監控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0b14;--card:#12131f;--border:#1e2035;--text:#c8cad0;--dim:#5a5d70;--accent:#ffd166;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
body{background:var(--bg);color:var(--text);font:13px/1.5 'SF Mono','Cascadia Code','Consolas',monospace;padding:16px;min-height:100vh}
h1{font-size:16px;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s}
h1 .dot.active{background:var(--green);box-shadow:0 0 6px var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.label{color:var(--dim);font-size:11px}
.val{font-weight:600}
.val.green{color:var(--green)}.val.red{color:var(--red)}.val.blue{color:var(--blue)}.val.purple{color:var(--purple)}.val.orange{color:var(--orange)}.val.accent{color:var(--accent)}
.stage-bar{display:flex;gap:4px;margin-top:8px}
.stage-step{flex:1;height:28px;border-radius:4px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);transition:all .3s;position:relative}
.stage-step.done{background:#1a3a2a;color:var(--green)}
.stage-step.active{background:#2a1a3a;color:var(--purple);box-shadow:0 0 8px rgba(167,139,250,.3)}
.stage-step.active::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4px solid var(--purple)}
.artifacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.art{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 8px;border-radius:4px;background:var(--bg)}
.art .icon{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.art .icon.ok{background:var(--green)}
.verdict-box{margin-top:8px;padding:8px 10px;border-radius:4px;font-size:11px;background:var(--bg);border-left:3px solid var(--dim)}
.verdict-box.pass{border-color:var(--green);color:var(--green)}
.verdict-box.fail{border-color:var(--red);color:var(--red)}
.commit{margin-top:8px;font-size:11px;color:var(--dim);word-break:break-all}
.commit .hash{color:var(--blue)}
.lock{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;background:#1a2a1a;color:var(--green)}
.lock.busy{background:#2a1a1a;color:var(--red)}
.updated{text-align:center;font-size:10px;color:var(--dim);margin-top:12px}
.tracks{margin-top:8px}
.track-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px}
.track-dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.track-dot.current{background:var(--accent)}
.track-dot.next{background:var(--blue)}
</style>
</head>
<body>
<h1><span class="dot" id="pulse"></span>MEGA IDLE 品質迴圈監控</h1>
<div class="grid">
  <div class="card">
    <h2>當前輪次</h2>
    <div class="row"><span class="label">全局輪次</span><span class="val accent" id="round">—</span></div>
    <div class="row"><span class="label">循環</span><span class="val" id="cycle">—</span></div>
    <div class="row"><span class="label">軌道</span><span class="val blue" id="track">—</span></div>
    <div class="row"><span class="label">下一軌道</span><span class="val" id="nextTrack" style="color:var(--dim)">—</span></div>
    <div class="row"><span class="label">修正輪</span><span class="val" id="fixRound">—</span></div>
  </div>
  <div class="card">
    <h2>執行階段</h2>
    <div class="stage-bar">
      <div class="stage-step" id="s1">取證</div>
      <div class="stage-step" id="s2">規劃</div>
      <div class="stage-step" id="s3">實作</div>
      <div class="stage-step" id="s4">評審</div>
    </div>
    <div class="row" style="margin-top:10px"><span class="label">狀態</span><span class="val" id="stageStatus">—</span></div>
    <div class="row"><span class="label">模型</span><span class="val purple" id="stageModel">—</span></div>
  </div>
  <div class="card">
    <h2>產出物</h2>
    <div class="artifacts">
      <div class="art"><span class="icon" id="a-evi"></span>取證證據</div>
      <div class="art"><span class="icon" id="a-plan"></span>規劃方案</div>
      <div class="art"><span class="icon" id="a-verd"></span>評審判決</div>
      <div class="art"><span class="icon" id="a-fb"></span>修正回饋</div>
    </div>
    <div class="verdict-box" id="verdictBox">等待評審…</div>
  </div>
  <div class="card">
    <h2>鎖 &amp; 最近提交</h2>
    <div class="row"><span class="label">鎖</span><span class="lock" id="lock">閒置</span></div>
    <div class="commit" id="commit">—</div>
  </div>
</div>
<div class="card" style="margin-bottom:12px">
  <h2>軌道輪換</h2>
  <div class="tracks" id="tracks"></div>
</div>
<div class="updated" id="updated">—</div>

<script>
const URL = "loop-state.json";
const POLL = 3000;
let prevRound = -1, blinkTimer = null;

function $(id) { return document.getElementById(id); }
function age(sec) {
  if (sec == null) return "—";
  if (sec < 60) return Math.round(sec) + "s";
  if (sec < 3600) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}

function render(d) {
  // pulse
  const pulse = $("pulse");
  if (d.round !== prevRound) { pulse.classList.add("active"); clearTimeout(blinkTimer); blinkTimer = setTimeout(() => pulse.classList.remove("active"), 5000); prevRound = d.round; }
  // round info
  $("round").textContent = "R=" + d.round;
  $("cycle").textContent = "循環 " + d.cycle;
  $("track").textContent = d.track;
  $("nextTrack").textContent = d.nextTrack || "—";
  $("fixRound").textContent = d.fixRound ? "是" : "否";
  $("fixRound").className = "val " + (d.fixRound ? "red" : "green");
  // stages
  const sn = d.stage.no;
  for (let i = 1; i <= 4; i++) {
    const el = $("s" + i);
    el.className = "stage-step" + (i < sn ? " done" : i === sn ? " active" : "");
  }
  $("stageStatus").textContent = d.stage.status === "idle" ? "閒置" : d.stage.name + " (" + d.stage.status + ")";
  $("stageStatus").className = "val " + (d.stage.status === "idle" ? "" : d.stage.status === "running" ? "orange" : "green");
  $("stageModel").textContent = d.stage.model || "—";
  // artifacts
  $("a-evi").className = "icon" + (d.artifacts.evidence.exists ? " ok" : "");
  $("a-plan").className = "icon" + (d.artifacts.plan.exists ? " ok" : "");
  $("a-verd").className = "icon" + (d.artifacts.verdict.exists ? " ok" : "");
  $("a-fb").className = "icon" + (d.artifacts.feedback.exists ? " ok" : "");
  // verdict
  const vb = $("verdictBox");
  if (d.verdict.status === "合格" || d.verdict.pass) {
    vb.className = "verdict-box pass"; vb.textContent = "✓ " + d.verdict.status;
  } else if (d.verdict.status === "不合格") {
    vb.className = "verdict-box fail"; vb.textContent = "✗ " + d.verdict.status;
  } else {
    vb.className = "verdict-box"; vb.textContent = d.verdict.status || "等待評審…";
  }
  // lock
  const lk = $("lock");
  if (d.lock.active) { lk.className = "lock busy"; lk.textContent = "執行中 " + age(d.lock.ageSec); }
  else { lk.className = "lock"; lk.textContent = "閒置"; }
  // commit
  if (d.lastCommit) {
    $("commit").innerHTML = '<span class="hash">' + d.lastCommit.hash + "</span> " + (d.lastCommit.subject || "").slice(0, 80);
  }
  // top report
  if (d.topReport) {
    $("commit").innerHTML += '<br><span style="color:var(--accent);font-size:10px">' + d.topReport.tag + "</span> " + (d.topReport.title || "").slice(0, 60);
  }
  // tracks
  const trackNames = ["戰鬥畫面美術優化","遊戲數值平衡","村莊與王國美術優化","QoL 與 UX"];
  let html = "";
  for (const t of trackNames) {
    const isCur = t === d.track;
    const isNext = t === d.nextTrack;
    html += '<div class="track-row"><span class="track-dot' + (isCur ? " current" : isNext ? " next" : "") + '"></span>' + t + (isCur ? " ← 當前" : isNext ? " ← 下一" : "") + "</div>";
  }
  $("tracks").innerHTML = html;
  // updated
  $("updated").textContent = "更新: " + new Date(d.updatedAt).toLocaleTimeString("zh-TW");
}

async function poll() {
  try {
    const r = await fetch(URL + "?t=" + Date.now());
    if (r.ok) render(await r.json());
  } catch {}
  setTimeout(poll, POLL);
}
poll();
</script>
</body>
</html>
