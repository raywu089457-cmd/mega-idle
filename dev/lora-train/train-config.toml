# kohya sd-scripts LoRA 訓練設定（SD1.5，3070 Ti 8GB）
# 訓練資料：dev/lora-dataset/（241 張遊戲自家手工 sprite，4x nearest 放大）
# 基底模型：SD1.5 v1-5-pruned-emaonly.safetensors（與 ComfyUI 共用）

[general]
pretrained_model_name_or_path = "C:/Users/ray/ComfyUI/models/checkpoints/v1-5-pruned-emaonly.safetensors"
train_data_dir = "C:/Users/ray/Desktop/Claude code/mega-idle/dev/lora-dataset"
output_dir = "C:/Users/ray/Desktop/Claude code/mega-idle/dev/lora-train/output"
output_name = "mega-idle-style"
save_model_as = "safetensors"
resolution = "256,256"          # sprite 小圖：256 而非 512，避免 4x 放大糊化
enable_bucket = true
min_bucket_reso = 128
max_bucket_reso = 320
bucket_reso_steps = 32

[training]
max_train_epochs = 8
max_train_steps = 1600
save_every_n_epochs = 2
save_last_n_epochs = 2
seed = 42
gradient_checkpointing = true
gradient_accumulation_steps = 1
mixed_precision = "bf16"
save_precision = "bf16"
cache_latents = true
cache_latents_to_disk = true
caption_extension = ".txt"
learning_rate = 1e-4
lr_scheduler = "cosine"
lr_warmup_steps = 100
optimizer_type = "AdamW8bit"
xformers = true
network_dim = 16
network_alpha = 8
noise_offset = 0.05
keep_tokens = 1
