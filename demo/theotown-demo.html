<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js × TheoTown 風格 Demo</title>
<style>
  @font-face {
    font-family: 'pixel';
    src: url('../fonts/fusion-pixel-12px-proportional-zh_hant.otf.woff2') format('woff2');
  }
  :root { --ink:#1a1d24; --panel:#2a2f3a; --panel2:#38404f; --gold:#ffd27a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:var(--ink); color:#e8eaf0;
    font-family:'pixel','Courier New',monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #wrap { position:relative; width:min(96vw,1100px,calc((100vh - 70px) * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; cursor:grab; touch-action:none; }
  canvas.dragging { cursor:grabbing; }
  #nightlay {
    position:absolute; inset:0; pointer-events:none; display:none;
    background:linear-gradient(rgba(13,20,44,.50), rgba(13,20,44,.34));
  }
  body.night #nightlay { display:block; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:10px 12px; pointer-events:none; }
  #title { text-shadow:2px 2px 0 #000; font-size:15px; letter-spacing:1px; }
  #title small { display:block; font-size:10px; color:#ffd27a; margin-top:3px; text-shadow:1px 1px 0 #000; }
  #btns { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end;
    background:rgba(26,29,36,.78); border:2px solid #000; padding:8px; box-shadow:2px 2px 0 rgba(0,0,0,.5); }
  button {
    font-family:inherit; font-size:12px; color:#fff; background:var(--panel);
    border:2px solid #000; border-radius:0; padding:7px 12px; cursor:pointer;
    box-shadow:2px 2px 0 rgba(0,0,0,.6); image-rendering:pixelated;
  }
  button:hover { background:var(--panel2); }
  button.on { background:#8a5a2f; }
  #hint {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:10px; color:#e8ecf2; background:rgba(26,29,36,.9); border:1px solid #000;
    padding:4px 10px; text-shadow:1px 1px 0 #000; white-space:nowrap;
  }
  #boot {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1a1d24; color:#ffd27a; font-size:13px; z-index:5; text-align:center; padding:20px;
  }
  #boot.err { color:#ff7b6b; }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="nightlay"></div>
  <div id="hud">
    <div id="title">THREE.JS × THEOTOWN 風格<small id="sub">2D 精靈模式 — TheoTown 原汁原味</small></div>
    <div id="btns">
      <button id="btnNight">🌙 夜晚</button>
      <button id="btnMode">🧱 3D 體素</button>
      <button id="btnAngle">📐 視角 B</button>
    </div>
  </div>
  <div id="hint">拖曳移動 · 滾輪縮放</div>
  <div id="boot">載入 three.js…</div>
</div>

<script type="module">
const boot = document.getElementById('boot');
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (e) {
  boot.textContent = 'three.js CDN 載入失敗：' + e.message + '\n請檢查網路連線';
  boot.classList.add('err');
  throw e;
}

/* ---------------- 常數 ---------------- */
const W = 960, H = 540;               // 內部低解析度 buffer, CSS 放大 → 粗顆粒像素
const TX = 20, TY = 14;               // 地圖瓦片數
const ROAD_X = new Set([6, 13]);      // 垂直道路欄
const ROAD_Y = new Set([1, 8, 12]);   // 水平道路列
const isRoad = (x, y) => ROAD_X.has(x) || ROAD_Y.has(y);
const wx = x => x - 9.5, wz = y => y - 6.5;   // 瓦片 → 世界座標

/* ---------------- 工具 ---------------- */
function mulberry32(a) { return function () {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};}
const rng = mulberry32(42);
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function shade(hex, amt) {           // amt -100..100
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, c + amt));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(c =>
    f(c).toString(16).padStart(2, '0')).join('');
}
function toTex(c, repX, repY) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repX) { t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY); }
  return t;
}

/* ---------------- 像素貼圖產生器 ---------------- */
function grassTex() {
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  g.fillStyle = '#7fc24f'; g.fillRect(0, 0, 16, 16);
  const r = mulberry32(7);
  for (let i = 0; i < 20; i++) {
    const x = (r() * 16) | 0, y = (r() * 16) | 0;
    g.fillStyle = r() < 0.5 ? '#77b848' : '#8acb5c';
    g.fillRect(x, y, 1, 1);
  }
  const f = mulberry32(9);
  g.fillStyle = '#dce8c4';
  for (let i = 0; i < 2; i++) {
    g.fillRect((f() * 15 | 0) + 1, (f() * 15 | 0) + 1, 1, 1);
  }
  return c;
}
function roadTex(vertical) {
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  g.fillStyle = '#c9c3b2'; g.fillRect(0, 0, 16, 16);            // 兩側人行道
  const r = mulberry32(11);
  for (let i = 0; i < 24; i++) {
    g.fillStyle = r() < 0.5 ? '#c2bcab' : '#d0cab9';
    g.fillRect((r() * 16) | 0, (r() * 16) | 0, 1, 1);
  }
  g.fillStyle = '#5f646b';                                       // 柏油
  if (vertical) g.fillRect(3, 0, 10, 16); else g.fillRect(0, 3, 16, 10);
  g.fillStyle = '#7d828b';                                       // 路緣
  if (vertical) { g.fillRect(2, 0, 1, 16); g.fillRect(13, 0, 1, 16); }
  else { g.fillRect(0, 2, 16, 1); g.fillRect(0, 13, 16, 1); }
  g.fillStyle = '#d8dce2';                                       // 虛線
  if (vertical) { g.fillRect(6, 0, 4, 6); g.fillRect(6, 8, 4, 6); }
  else { g.fillRect(0, 5, 6, 4); g.fillRect(8, 5, 6, 4); }
  return c;
}
function carTex(color) {                                       // 俯視車,車頭朝右(方形貼圖,旋轉不失比例)
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  g.clearRect(0, 0, 16, 16);
  g.fillStyle = '#1a1d24'; g.fillRect(0, 3, 16, 10);           // 輪廓
  g.fillStyle = '#111';
  g.fillRect(1, 4, 2, 2); g.fillRect(13, 4, 2, 2); g.fillRect(1, 10, 2, 2); g.fillRect(13, 10, 2, 2); // 輪
  g.fillStyle = color; g.fillRect(1, 6, 14, 4);                // 車身
  g.fillStyle = shade(color, 22); g.fillRect(1, 6, 14, 1);     // 亮邊
  g.fillStyle = '#223'; g.fillRect(3, 5, 10, 6);               // 玻璃區
  g.fillStyle = shade(color, -30); g.fillRect(3, 5, 10, 2);    // 車頂
  g.fillStyle = '#9fc4e0'; g.fillRect(3, 5, 4, 2);             // 擋風反光
  g.fillStyle = '#ffe9a8'; g.fillRect(15, 7, 1, 2);            // 頭燈
  g.fillStyle = '#8a2020'; g.fillRect(0, 7, 1, 2);             // 尾燈
  return c;
}
function smokeTex() {
  const c = makeCanvas(8, 8), g = c.getContext('2d');
  const gr = g.createRadialGradient(4, 4, 1, 4, 4, 4);
  gr.addColorStop(0, 'rgba(240,240,240,.9)');
  gr.addColorStop(1, 'rgba(240,240,240,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 8, 8);
  return c;
}
function treeTex(night, v) {
  const c = makeCanvas(24, 32), g = c.getContext('2d');
  g.clearRect(0, 0, 24, 32);
  g.fillStyle = '#6b4a2f'; g.fillRect(10, 24, 4, 8);           // 樹幹
  const P = v === 0
    ? [['#4f9e46', 11, 20, 9], ['#3f8a3c', 7, 12, 8], ['#4f9e46', 12, 7, 8], ['#5db455', 16, 14, 7]]
    : [['#3f8a3c', 11, 20, 9], ['#2f6f30', 7, 12, 8], ['#3f8a3c', 12, 7, 8], ['#4f9e46', 16, 14, 7]];
  const blobs = night ? P.map(([col, x, y, r]) => [shade(col, -26), x, y, r]) : P;
  for (const [col, x, y, r] of blobs) {                         // 暗色描邊
    g.fillStyle = '#1c2c18'; g.beginPath(); g.arc(x, y, r + 1, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,.3)';                         // 頂光
  g.fillRect(5, 5, 4, 2); g.fillRect(14, 9, 3, 2); g.fillRect(8, 2, 2, 2);
  for (let i = 0; i < 10; i++) {                                // 鋸齒像素
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.fillRect((rng() * 24) | 0, (rng() * 30) | 0, 1, 1);
  }
  return c;
}
function roofTex(color) {                                       // 體素模式屋頂瓦片
  const c = makeCanvas(48, 48), g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, 48, 48);
  g.fillStyle = shade(color, 14);
  for (let x = 0; x < 48; x += 6) g.fillRect(x, 0, 2, 48);
  g.fillStyle = shade(color, -22);
  for (let x = 3; x < 48; x += 6) g.fillRect(x, 0, 2, 48);
  g.fillStyle = shade(color, 30); g.fillRect(0, 0, 48, 1);
  return c;
}
function buildingTex(o) {
  const { floors, type, night, crop } = o;
  const w = 48;
  const h = 60 + floors * 18;
  const roofH = Math.round(h * 0.3);
  const c = makeCanvas(w, h), g = c.getContext('2d');
  const wall = night ? shade(o.wall, -18) : o.wall;
  const roof = night ? shade(o.roof, -24) : o.roof;
  const win = night ? '#ffd27a' : '#3a4a6e';
  const winHi = night ? '#ffe9a8' : '#4a5c86';
  const winLo = night ? '#e8a83c' : '#283450';
  const frame = '#1c2430';

  g.fillStyle = '#14171d'; g.fillRect(0, 0, w, h);             // 整棟輪廓底

  const fy = crop ? 4 : roofH + 9;                             // 牆面起點
  g.fillStyle = wall; g.fillRect(2, fy, w - 4, h - fy - 2);

  // 磚紋:橫排暗線 + 交錯直縫
  g.fillStyle = shade(wall, -13);
  for (let y = fy + 3; y < h - 3; y += 5) g.fillRect(2, y, w - 4, 1);
  g.fillStyle = shade(wall, -20);
  for (let y = fy + 3, i = 0; y < h - 3; y += 5, i++) {
    for (let x = 5 + (i % 2) * 4; x < w - 5; x += 8) g.fillRect(x, y, 1, 5);
  }
  // 左右立體明暗
  g.fillStyle = shade(wall, 16); g.fillRect(2, fy, 3, h - fy - 2);
  g.fillStyle = shade(wall, -24); g.fillRect(w - 8, fy, 6, h - fy - 2);

  // 樓層簷口線
  if (floors > 1) {
    for (let f = 1; f < floors; f++) {
      const y = fy + Math.round((h - fy) * f / floors);
      g.fillStyle = shade(wall, 22); g.fillRect(2, y - 2, w - 4, 1);
      g.fillStyle = shade(wall, -32); g.fillRect(2, y - 1, w - 4, 2);
    }
  }

  let ay = -99;                                                // 店面遮陽棚位置
  if (!crop) {
    // 斜屋頂(2.5D)+瓦排
    g.fillStyle = roof;
    g.beginPath();
    g.moveTo(1, roofH - 6); g.lineTo(w - 1, roofH - 12);
    g.lineTo(w - 1, roofH + 4); g.lineTo(1, roofH + 10);
    g.closePath(); g.fill();
    g.strokeStyle = shade(roof, -14); g.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      g.beginPath();
      g.moveTo(1, roofH - 6 + i * 3.2);
      g.lineTo(w - 1, roofH - 12 + i * 3.2);
      g.stroke();
    }
    g.fillStyle = shade(roof, 26); g.fillRect(1, roofH - 7, w - 2, 2);   // 屋脊亮線
    g.fillStyle = shade(roof, -38); g.fillRect(2, roofH + 7, w - 4, 3);  // 屋簷陰影

    if (type === 'house') {
      g.fillStyle = '#8a6b55'; g.fillRect(w - 13, roofH - 22, 6, 13);    // 煙囪
      g.fillStyle = '#6e5443'; g.fillRect(w - 14, roofH - 24, 8, 3);
      g.fillStyle = shade(roof, -20); g.fillRect(w - 13, roofH - 10, 6, 2);
    }
    if (type === 'factory') {
      g.fillStyle = '#6b6b72'; g.fillRect(6, roofH - 14, 7, 18);         // 煙囪
      g.fillStyle = '#4a4a52'; g.fillRect(5, roofH - 15, 9, 2);
      g.fillStyle = '#3a3a42'; g.fillRect(7, roofH - 9, 5, 2);
    }
    if (type === 'tower') {
      g.fillStyle = shade(roof, -12);                                    // 尖塔
      g.beginPath(); g.moveTo(w / 2 - 5, roofH - 14); g.lineTo(w / 2 + 5, roofH - 14);
      g.lineTo(w / 2, roofH - 36); g.closePath(); g.fill();
      g.fillStyle = '#c9b458'; g.fillRect(w / 2 - 1, roofH - 38, 2, 4);
      g.fillStyle = '#8a2f28'; g.fillRect(w / 2 - 4, roofH - 13, 8, 3);
    }
  }

  if (type === 'shop') {                                         // 遮陽棚+招牌+大櫥窗
    ay = fy + Math.round((h - fy) * 0.16);
    for (let x = 3; x < w - 3; x += 6) {
      g.fillStyle = (x / 6) % 2 ? '#c0504a' : '#f4f1ea';
      g.fillRect(x, ay, 5, 4);
    }
    g.fillStyle = '#14171d'; g.fillRect(3, ay + 4, w - 6, 1);
    g.fillStyle = '#7a5a2f'; g.fillRect(w / 2 - 8, ay + 7, 16, 6);
    g.fillStyle = '#ffe9a8'; g.fillRect(w / 2 - 5, ay + 8, 3, 4);
    g.fillStyle = '#ffe9a8'; g.fillRect(w / 2 + 1, ay + 8, 3, 4);
    g.fillStyle = frame; g.fillRect(5, ay + 16, 16, 12);
    g.fillStyle = win; g.fillRect(6, ay + 17, 14, 10);
    g.fillStyle = winHi; g.fillRect(6, ay + 17, 14, 2);
    g.fillStyle = shade(wall, -26); g.fillRect(5, ay + 28, 16, 2);
  } else if (type === 'tower') {                                 // 鐘樓
    g.fillStyle = '#f4f1ea';
    g.beginPath(); g.arc(w / 2, fy + 16, 6, 0, 7); g.fill();
    g.fillStyle = '#14171d'; g.fillRect(w / 2 - 1, fy + 11, 2, 10);
    g.fillRect(w / 2 - 6, fy + 15, 12, 1);
  }

  // 窗戶(帶窗台陰影/亮線)
  const cols = type === 'apartment' ? 3 : 2;
  let rows = type === 'factory' ? floors + 1 : floors * 2;
  const wy0 = fy + (type === 'shop' ? 20 : 12);
  const cw = 4, ch = 5, gapX = 4, gapY = 7;
  const ox = (w - cols * cw - (cols - 1) * gapX) / 2;
  rows = Math.min(rows, Math.max(1, Math.floor((h - 16 - wy0) / (ch + gapY))));
  for (let r = 0; r < rows; r++) {
    for (let cc = 0; cc < cols; cc++) {
      const px = 6 + ox + cc * (cw + gapX);
      const py = wy0 + r * (ch + gapY);
      if (type === 'shop' && py > ay + 12) continue;
      g.fillStyle = frame; g.fillRect(px - 1, py - 1, cw + 2, ch + 2);
      g.fillStyle = win; g.fillRect(px, py, cw, ch);
      g.fillStyle = winHi; g.fillRect(px, py, cw, 1);
      g.fillStyle = winLo; g.fillRect(px, py + ch - 1, cw, 1);
      g.fillStyle = shade(wall, -26); g.fillRect(px - 1, py + ch + 1, cw + 2, 1);
      g.fillStyle = shade(wall, 14); g.fillRect(px - 1, py + ch + 2, cw + 2, 1);
      if (night) { g.fillStyle = 'rgba(255,210,122,.28)'; g.fillRect(px - 2, py - 2, cw + 4, ch + 4); }
    }
  }

  // 門+台階
  const dw = 6, dh = 10;
  g.fillStyle = frame; g.fillRect(w / 2 - dw / 2 - 1, h - dh - 4, dw + 2, dh + 2);
  g.fillStyle = shade(wall, -34); g.fillRect(w / 2 - dw / 2, h - dh - 3, dw, dh);
  g.fillStyle = winLo; g.fillRect(w / 2 - dw / 2 + 1, h - dh - 1, 1, dh - 3);
  g.fillStyle = winLo; g.fillRect(w / 2 + dw / 2 - 2, h - dh - 1, 1, dh - 3);
  g.fillStyle = '#c9b458'; g.fillRect(w / 2 - 1, h - dh + 2, 1, 2);
  g.fillStyle = shade(wall, -22); g.fillRect(w / 2 - dw / 2 - 1, h - 2, dw + 2, 1);

  g.fillStyle = '#14171d'; g.fillRect(0, h - 3, w, 3);          // 基座陰影
  return c;
}

/* ---------------- 城市資料 ---------------- */
const B_TYPES = [
  { type: 'house', floors: 1, weight: 44 },
  { type: 'house', floors: 2, weight: 18 },
  { type: 'apartment', floors: 3, weight: 14 },
  { type: 'shop', floors: 1, weight: 12 },
  { type: 'factory', floors: 1, weight: 7 },
  { type: 'tower', floors: 4, weight: 5 },
];
const PALETTE = {
  house:     [{ wall: '#e8dcc0', roof: '#c0504a' }, { wall: '#d8cbb0', roof: '#6a8a9e' }, { wall: '#e8e0d0', roof: '#8a6f4d' }],
  apartment: [{ wall: '#c9ccd2', roof: '#4a4f58' }, { wall: '#b9bdc6', roof: '#3e434b' }],
  shop:      [{ wall: '#f4f1ea', roof: '#6a7a8a' }, { wall: '#eef0e4', roof: '#a05540' }],
  factory:   [{ wall: '#a9745a', roof: '#5a6169' }],
  tower:     [{ wall: '#cfd3d8', roof: '#4a5060' }],
};
function pickType() {
  let r = rng() * 100;
  for (const t of B_TYPES) { if ((r -= t.weight) < 0) return t; }
  return B_TYPES[0];
}
function buildCityData() {
  const buildings = [], trees = [];
  const tiles = [];
  const isPond = (x, y) => (x === 1 || x === 2) && (y === 2 || y === 3);
  for (let x = 0; x < TX; x++) for (let y = 0; y < TY; y++) if (!isRoad(x, y) && !isPond(x, y)) tiles.push([x, y]);
  for (const [x, y] of tiles) {
    const r = rng();
    if (r < 0.5 && buildings.length < 110) {
      const t = pickType();
      const pals = PALETTE[t.type];
      buildings.push({ x, y, ...t, palette: pals[(rng() * pals.length) | 0] });
    } else if (r < 0.68 && trees.length < 100) {
      trees.push({ x, y, rot: rng() * Math.PI, v: (rng() * 2) | 0 });
    }
  }
  return { buildings, trees };
}

/* ---------------- 場景 ---------------- */
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera();
let fh = 15, pitch = 50 * Math.PI / 180;                        // frustum 高(瓦片數) / 俯角(等角感)
const center = { x: 0, z: 0 };
const group2D = new THREE.Group(), group3D = new THREE.Group();
scene.add(group2D);
const cars = [], smoke = [];
const entries = [];                                             // 每個建築:日夜材質 + 煙囪位置
let isNight = false, is3D = false;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
scene.background = new THREE.Color('#a9d3f7');

/* 地面 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(TX + 10, TY + 8),
  new THREE.MeshBasicMaterial({ map: toTex(grassTex(), TX + 10, TY + 8) })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* 道路 */
function roadStrip(w, len, x, z, y, tex, repU, repV) {
  const t = toTex(tex);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repU, repV);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len),
    new THREE.MeshBasicMaterial({ map: t }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  scene.add(m);
}
const texRoadV = roadTex(true), texRoadH = roadTex(false);
for (const x of ROAD_X) roadStrip(1, TY + 8, wx(x), 0, 0.01, texRoadV, 1, TY + 8);
for (const y of ROAD_Y) roadStrip(TX + 10, 1, 0, wz(y), 0.02, texRoadH, TX + 10, 1);

/* 建築 / 樹 */
const { buildings, trees } = buildCityData();
const texCache = new Map();
function texFor(key, fn) {
  if (!texCache.has(key)) texCache.set(key, fn());
  return texCache.get(key);
}
function build2D(entries) {
  for (const e of entries) {
    const texD = texFor('b' + e.key + 'd', () => toTex(buildingTex({
      floors: e.floors, type: e.type, night: false, rng,
      wall: e.palette.wall, roof: e.palette.roof,
    })));
    const texN = texFor('b' + e.key + 'n', () => toTex(buildingTex({
      floors: e.floors, type: e.type, night: true, rng,
      wall: e.palette.wall, roof: e.palette.roof,
    })));
    const planeH = e.planeH;
    const bx = wx(e.x) + e.sx, bz = wz(e.y) + e.sz;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.92, planeH),
      new THREE.MeshBasicMaterial({ map: isNight ? texN : texD }));
    mesh.position.set(bx, planeH / 2, bz);
    group2D.add(mesh);
    e.mesh2D = mesh; e.texD = texD; e.texN = texN;
    const lot = new THREE.Mesh(new THREE.PlaneGeometry(1.14, 1.14),
      new THREE.MeshBasicMaterial({ color: 0x4c7d30, transparent: true, opacity: 0.8, depthWrite: false }));
    lot.rotation.x = -Math.PI / 2;
    lot.position.set(bx, 0.008, bz);
    group2D.add(lot);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.98, planeH * 0.5),
      new THREE.MeshBasicMaterial({ color: 0x0d2410, transparent: true, opacity: 0.24, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(bx + 0.12, 0.015, bz - 0.12);
    group2D.add(shadow);
  }
  for (const t of trees) {
    const texD = texFor('t' + t.key + 'd', () => toTex(treeTex(false, t.v)));
    const texN = texFor('t' + t.key + 'n', () => toTex(treeTex(true, t.v)));
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.83),
      new THREE.MeshBasicMaterial({ map: isNight ? texN : texD, transparent: true, alphaTest: 0.5 }));
    mesh.position.set(wx(t.x), 0.415, wz(t.y));
    mesh.rotation.y = t.rot;
    group2D.add(mesh);
    t.mesh2D = mesh; t.texD = texD; t.texN = texN;
  }
}
function build3D(entries) {
  for (const e of entries) {
    const sideD = texFor('s' + e.key + 'd', () => toTex(buildingTex({
      floors: e.floors, type: e.type, night: false, crop: true, rng,
      wall: e.palette.wall, roof: e.palette.roof,
    })));
    const sideN = texFor('s' + e.key + 'n', () => toTex(buildingTex({
      floors: e.floors, type: e.type, night: true, crop: true, rng,
      wall: e.palette.wall, roof: e.palette.roof,
    })));
    const roofD = texFor('r' + e.key + 'd', () => toTex(roofTex(e.palette.roof)));
    const roofN = texFor('r' + e.key + 'n', () => toTex(roofTex(shade(e.palette.roof, -24))));
    const mk = (side, top) => new THREE.MeshBasicMaterial({ map: side });
    const matD = [mk(sideD, roofD), mk(sideD, roofD), mk(roofD, roofD), mk(roofD, roofD), mk(sideD, roofD), mk(sideD, roofD)];
    const matN = [mk(sideN, roofN), mk(sideN, roofN), mk(roofN, roofN), mk(roofN, roofN), mk(sideN, roofN), mk(sideN, roofN)];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.92, e.planeH, 0.92), isNight ? matN : matD);
    mesh.position.set(wx(e.x) + e.sx, e.planeH / 2, wz(e.y) + e.sz);
    group3D.add(mesh);
    e.mesh3D = mesh; e.matD = matD; e.matN = matN;
  }
  for (const t of trees) {
    const grp = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.35, 0.1),
      new THREE.MeshBasicMaterial({ color: '#6b4a2f' }));
    trunk.position.y = 0.175;
    const green = isNight ? shade(t.v ? '#2f6f30' : '#3f8a3c', -10) : (t.v ? '#2f6f30' : '#3f8a3c');
    const green2 = isNight ? shade(t.v ? '#3f8a3c' : '#4f9e46', -10) : (t.v ? '#3f8a3c' : '#4f9e46');
    const b1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32, 0),
      new THREE.MeshBasicMaterial({ color: green }));
    b1.position.y = 0.55;
    const b2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0),
      new THREE.MeshBasicMaterial({ color: green2 }));
    b2.position.y = 0.82;
    grp.add(trunk, b1, b2);
    grp.position.set(wx(t.x), 0, wz(t.y));
    grp.rotation.y = t.rot;
    group3D.add(grp);
    t.mesh3D = grp;
  }
}
for (const b of buildings) {
  const floors = b.floors;
  const planeH = (60 + floors * 18) / 48 * 0.92;
  // 貼路:建築往相鄰道路那側偏移,營造街區感
  let sx = 0, sz = 0;
  if (ROAD_Y.has(b.y - 1) && !ROAD_Y.has(b.y + 1)) sz += 0.13;
  if (ROAD_Y.has(b.y + 1) && !ROAD_Y.has(b.y - 1)) sz -= 0.13;
  if (ROAD_X.has(b.x - 1) && !ROAD_X.has(b.x + 1)) sx += 0.13;
  if (ROAD_X.has(b.x + 1) && !ROAD_X.has(b.x - 1)) sx -= 0.13;
  entries.push({
    x: b.x, y: b.y, sx, sz, floors, type: b.type, palette: b.palette,
    planeH, key: b.x + '_' + b.y,
    smoke: b.type === 'factory' ? { x: wx(b.x) - 0.08, z: wz(b.y) - 0.08, t: rng() * 1.4 } : null,
  });
}
for (const t of trees) t.key = t.x + '_' + t.y + '_' + t.v;
build2D(entries);

/* 汽車 */
const carColors = ['#e0564a', '#4a8fe0', '#f0c84a', '#8ad060', '#d060b0', '#50b0a0', '#f09050', '#c8c8d0', '#60a8f0', '#e88040'];
const routes = [
  [[6, 1], [13, 1], [13, 12], [6, 12]],
  [[6, 1], [13, 1], [13, 12], [6, 12]],
  [[6, 1], [13, 1], [13, 12], [6, 12]],
  [[6, 1], [13, 1], [13, 12], [6, 12]],
  [[13, 0], [13, 13]],
  [[13, 0], [13, 13]],       // 反方向
  [[6, 0], [6, 13]],
  [[6, 0], [6, 13]],         // 反方向
  [[0, 8], [19, 8]],
  [[0, 8], [19, 8]],         // 反方向
];
routes.forEach((route, i) => {
  const tex = carTex(carColors[i % carColors.length]);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.8),
    new THREE.MeshBasicMaterial({ map: toTex(tex), transparent: true, alphaTest: 0.5 }));
  const pts = route.map(([x, y]) => ({ x: wx(x), z: wz(y) }));
  if (i === 5 || i === 7 || i === 9) pts.reverse();
  mesh.position.set(pts[0].x, 0.17, pts[0].z);
  scene.add(mesh);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7),
    new THREE.MeshBasicMaterial({ color: 0x0d2410, transparent: true, opacity: 0.16, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2;
  sh.position.set(pts[0].x + 0.12, 0.035, pts[0].z - 0.12);
  scene.add(sh);
  cars.push({ mesh, sh, pts, idx: 0, speed: 1.4 + rng() * 0.8 });
});

/* 路口補丁:蓋住穿越交叉口的虛線 */
function intersectionTex() {
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  g.fillStyle = '#c9c3b2'; g.fillRect(0, 0, 16, 16);            // 人行道
  const r = mulberry32(13);
  for (let i = 0; i < 20; i++) {
    g.fillStyle = r() < 0.5 ? '#c2bcab' : '#d0cab9';
    g.fillRect((r() * 16) | 0, (r() * 16) | 0, 1, 1);
  }
  g.fillStyle = '#5f646b'; g.fillRect(3, 3, 10, 10);            // 路面
  g.fillStyle = '#7d828b';                                       // 路緣
  g.fillRect(2, 2, 12, 1); g.fillRect(2, 13, 12, 1);
  g.fillRect(2, 2, 1, 12); g.fillRect(13, 2, 1, 12);
  g.fillStyle = '#e8ecf2';                                       // 斑馬線
  for (let i = 0; i < 3; i++) {
    g.fillRect(5 + i * 2, 3, 1, 2);
    g.fillRect(5 + i * 2, 11, 1, 2);
    g.fillRect(3, 5 + i * 2, 2, 1);
    g.fillRect(11, 5 + i * 2, 2, 1);
  }
  return c;
}
const texIntersect = toTex(intersectionTex());
for (const x of ROAD_X) for (const y of ROAD_Y) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.02, 1.02),
    new THREE.MeshBasicMaterial({ map: texIntersect }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(wx(x), 0.03, wz(y));
  scene.add(m);
}

/* 街燈(路口四角) */
function lampTex() {
  const c = makeCanvas(12, 20), g = c.getContext('2d');
  g.clearRect(0, 0, 12, 20);
  g.fillStyle = 'rgba(255,210,122,.3)';
  g.fillRect(3, 1, 6, 5);
  g.fillStyle = '#ffd27a'; g.fillRect(4, 2, 4, 3);
  g.fillStyle = '#2a2e35'; g.fillRect(5, 5, 2, 15);
  return c;
}
const texLamp = toTex(lampTex());
for (const x of ROAD_X) for (const y of ROAD_Y) {
  for (const [dx, dz] of [[0.55, 0.55], [-0.55, 0.55], [0.55, -0.55], [-0.55, -0.55]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.5),
      new THREE.MeshBasicMaterial({ map: texLamp, transparent: true, alphaTest: 0.5 }));
    m.position.set(wx(x) + dx, 0.25, wz(y) + dz);
    scene.add(m);
  }
}

/* 池塘 */
function pondTex() {
  const c = makeCanvas(48, 48), g = c.getContext('2d');
  g.fillStyle = '#2e6a96'; g.fillRect(0, 0, 48, 48);
  g.fillStyle = '#4a93c4'; g.fillRect(3, 3, 42, 42);
  g.fillStyle = '#5ba4d6';
  for (let y = 5; y < 44; y += 4) for (let x = 5; x < 44; x += 5) g.fillRect(x, y, 2, 2);
  g.fillStyle = '#7cc0e8';
  for (let y = 7; y < 42; y += 8) for (let x = 7; x < 42; x += 9) g.fillRect(x, y, 2, 1);
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.fillRect(12, 10, 2, 2); g.fillRect(30, 24, 2, 2); g.fillRect(20, 34, 2, 2);
  return c;
}
const pond = new THREE.Mesh(new THREE.PlaneGeometry(2, 2),
  new THREE.MeshBasicMaterial({ map: toTex(pondTex()) }));
pond.rotation.x = -Math.PI / 2;
pond.position.set(-7.5, 0.006, -4);
scene.add(pond);

/* 煙霧 */
const smokeTexT = toTex(smokeTex());
function spawnSmoke(e) {
  if (!e.smoke || smoke.length > 12) return;
  const mat = new THREE.SpriteMaterial({ map: smokeTexT, transparent: true, depthWrite: false, opacity: 0.85 });
  const s = new THREE.Sprite(mat);
  s.scale.set(0.3, 0.3, 1);
  s.position.set(e.smoke.x, e.planeH * 0.5 + 0.15, e.smoke.z);
  scene.add(s);
  smoke.push({ s, age: 0 });
}

/* ---------------- 日夜 ---------------- */
function applyNight() {
  scene.background = new THREE.Color(isNight ? '#0e1730' : '#a9d3f7');
  for (const e of entries) {
    if (is3D) {
      e.mesh3D.material = isNight ? e.matN : e.matD;
    } else {
      if (e.mesh2D) e.mesh2D.material.map = isNight ? e.texN : e.texD;
    }
  }
  for (const t of trees) {
    if (is3D) {
      t.mesh3D.children.forEach((c, i) => {
        if (i > 0) c.material.color.set(isNight
          ? shade(t.v ? '#2f6f30' : '#3f8a3c', -10) : (t.v ? '#2f6f30' : '#3f8a3c'));
      });
    } else if (t.mesh2D) {
      t.mesh2D.material.map = isNight ? t.texN : t.texD;
    }
  }
  document.body.classList.toggle('night', isNight);
  document.getElementById('btnNight').textContent = isNight ? '☀️ 白天' : '🌙 夜晚';
}

/* ---------------- 2D / 3D 切換 ---------------- */
function setMode(threeD) {
  is3D = threeD;
  if (threeD) {
    scene.remove(group2D);
    if (group3D.children.length === 0) build3D(entries);
    scene.add(group3D);
  } else {
    scene.remove(group3D);
    scene.add(group2D);
  }
  applyNight();
  const sub = document.getElementById('sub');
  sub.textContent = threeD ? '3D 體素模式 — 可旋轉、有深度' : '2D 精靈模式 — TheoTown 原汁原味';
  document.getElementById('btnMode').textContent = threeD ? '🖼 2D 精靈' : '🧱 3D 體素';
}

/* ---------------- 相機(像素對齊防抖動) ---------------- */
function snapCam() {
  const K = fh / H;                       // 1px = K 世界單位
  const c = Math.cos(pitch);
  center.x = Math.round(center.x / K) * K;
  center.z = Math.round((center.z * c) / K) * K / c;
}
function updateCamera() {
  const fw = fh * W / H;
  camera.left = -fw / 2; camera.right = fw / 2;
  camera.top = fh / 2; camera.bottom = -fh / 2;
  camera.position.set(center.x,
    26 * Math.sin(pitch), center.z + 26 * Math.cos(pitch));
  camera.lookAt(center.x, 0, center.z);
  camera.updateProjectionMatrix();
}
snapCam(); updateCamera();

/* 視角切換 */
let angleIdx = 0;
const PITCHES = [50, 34];
document.getElementById('btnAngle').addEventListener('click', () => {
  angleIdx = (angleIdx + 1) % PITCHES.length;
  pitch = PITCHES[angleIdx] * Math.PI / 180;
  snapCam(); updateCamera();
  document.getElementById('btnAngle').textContent = '📐 視角 ' + (angleIdx === 0 ? 'B' : 'A');
});

/* 拖曳平移 + 滾輪縮放 */
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lx = e.clientX; ly = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  center.x -= dx * fh / H;
  center.z -= dy * (fh / H) / Math.cos(pitch);
  snapCam(); updateCamera();
});
canvas.addEventListener('pointerup', e => {
  dragging = false; canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  fh = Math.max(9, Math.min(30, fh * (1 + e.deltaY * 0.001)));
  snapCam(); updateCamera();
}, { passive: false });

/* 按鈕 */
document.getElementById('btnNight').addEventListener('click', () => {
  isNight = !isNight; applyNight();
});
document.getElementById('btnMode').addEventListener('click', () => {
  setMode(!is3D);
});

/* ---------------- 主迴圈 ---------------- */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const car of cars) {
    if (!window.__demo || !window.__demo.paused) {
      const p0 = car.pts[car.idx], p1 = car.pts[(car.idx + 1) % car.pts.length];
      const dx = p1.x - p0.x, dz = p1.z - p0.z;
      const len = Math.hypot(dx, dz);
      car.t = (car.t || 0) + car.speed * dt;
      if (car.t >= len) { car.t -= len; car.idx = (car.idx + 1) % car.pts.length; }
      const k = (car.t || 0) / len;
      const lane = 0.24;
      let ox = 0, oz = 0;
      if (Math.abs(dz) > Math.abs(dx)) ox = dz > 0 ? lane : -lane;   // 直向路靠右
      else oz = dx > 0 ? lane : -lane;                               // 橫向路靠右
      car.mesh.position.x = p0.x + dx * k + ox;
      car.mesh.position.z = p0.z + dz * k + oz;
      car.sh.position.x = car.mesh.position.x + 0.12;
      car.sh.position.z = car.mesh.position.z - 0.12;
      // 貼圖旋轉對齊螢幕投影方向(平面永遠面向鏡頭,避免側視消失)
      car.mesh.rotation.y = 0;
      car.mesh.material.map.rotation = Math.atan2(-dz * Math.cos(pitch), dx);
      car.mesh.material.map.needsUpdate = true;
    }
  }

  for (const e of entries) {
    if (!e.smoke) continue;
    e.smoke.t -= dt;
    if (e.smoke.t <= 0) { e.smoke.t = 1.3 + rng() * 0.7; spawnSmoke(e); }
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i];
    p.age += dt;
    if (p.age > 2.4) {
      scene.remove(p.s); p.s.material.dispose();
      smoke.splice(i, 1);
      continue;
    }
    p.s.position.y += 0.45 * dt;
    p.s.scale.setScalar(0.3 + p.age * 0.22);
    p.s.material.opacity = 0.85 * (1 - p.age / 2.4);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* 啟動 */
window.__demo = {
  THREE, renderer, scene, get cars() { return cars; }, get smoke() { return smoke; },
  center, camera, paused: false,
  get fh() { return fh; }, set fh(v) { fh = v; snapCam(); updateCamera(); },
  panTo(x, z) { center.x = x; center.z = z; snapCam(); updateCamera(); },
};
document.getElementById('boot').style.display = 'none';
tick();
</script>
